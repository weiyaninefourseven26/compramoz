<div class="seller">
  <h2>Queres vender na CompraMoz?</h2>
  <p>Junta-te à nossa rede de vendedores em Maputo!</p>

  <form onsubmit="enviarPedido(event)">
    <label for="nome">Nome ou nome da loja</label>
    <input id="nome" class="search" type="text"
      placeholder="Ex.: Loja do João" required>

    <label for="telefone">Teu número de telefone</label>
    <input id="telefone" class="search" type="tel"
      placeholder="Ex.: 84 123 4567" required>

    <label for="tipo">O que pretendes vender?</label>
    <select id="tipo" class="search" required>
      <option value="">Escolhe uma categoria</option>
      <option>Moda</option>
      <option>Telemóveis</option>
      <option>Informática</option>
      <option>Casa</option>
      <option>Beleza</option>
      <option>Alimentação</option>
      <option>Outros artigos</option>
    </select>

<label for="produto">Nome do produto</label>
<input id="produto" class="search" type="text"
placeholder="Ex.: Camisola, Samsung Galaxy" required>

<label for="preco">Preço do produto (MT)</label>
<input id="preco" class="search" type="number"
placeholder="Ex.: 1500" min="1" required>

<label for="descricao">Descrição do produto</label>
<textarea id="descricao" class="search"
placeholder="Estado, tamanho, cor ou outros detalhes"
required></textarea>

    <button class="btn" type="submit">
      Enviar pedido pelo WhatsApp
    </button>
  </form>
</div>


<script>
function enviarPedido(event) {
  event.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const tipo = document.getElementById("tipo").value;
  const produto = document.getElementById("produto").value.trim();
  const preco = document.getElementById("preco").value;
  const descricao = document.getElementById("descricao").value.trim();

  const mensagem =
    "Olá, CompraMoz! Tenho interesse em vender na plataforma.\n\n" +
    "Nome/Loja: " + nome + "\n" +
    "Telefone: " + telefone + "\n" +
    "Categoria: " + tipo + "\n" +
    "Produto: " + produto + "\n" +
    "Preço: " + preco + " MT\n" +
    "Descrição: " + descricao;

  const url = "https://wa.me/258844064166?text=" +
    encodeURIComponent(mensagem);

  window.open(url, "_blank");
}
</script>
